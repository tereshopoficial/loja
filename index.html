<div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Título / Legenda Curta do Destaque *</label>
        <input type="text" id="videoTitle" required placeholder="Ex: Lote novo de iPhones lacrados ou Feirão de Motos!"
          class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Link Direto de Contato (WhatsApp ou Instagram)</label>
        <input type="text" id="videoContactLink" placeholder="Ex: 86999999999 ou [https://instagram.com/tereshopping](https://instagram.com/tereshopping)"
          class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" />
      </div>

      <div class="space-y-2 pt-1">
        <button type="submit" id="publishVideoBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition">
          Publicar Destaque 24h
        </button>
        <button type="button" onclick="cancelAndReturnFromAdmin()" class="w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-200 transition">
          Cancelar e Voltar ao Feed
        </button>
      </div>

      <div id="adminActiveVideosList" class="pt-3 border-t border-gray-200 space-y-2"></div>
    </form>

    <!-- ABA 4: BANNERS PROMOCIONAIS ROTATIVOS DO TOPO -->
    <form id="bannersForm" onsubmit="handleSavePromoBanner(event)" class="space-y-4 hidden">
      <div class="p-3 rounded-xl bg-blue-50 border border-blue-200 text-[11px] text-blue-950">
        <b>Banners Rotativos no Topo:</b> Os banners alternam automaticamente a cada <b>4 segundos</b> e podem ser deslizados com o dedo. Ao clicar no banner, o cliente filtra o departamento vinculado.
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1.5">Imagem do Banner Horizontal *</label>
        <label for="bannerImageInput" class="flex items-center justify-center gap-2 w-full py-3.5 px-4 rounded-xl border-2 border-dashed border-blue-400 bg-blue-50 text-blue-900 text-xs font-bold cursor-pointer">
          <i class="fa-solid fa-panorama text-base"></i>
          <span>Selecionar Imagem do Banner (HD)</span>
        </label>
        <input type="file" id="bannerImageInput" accept="image/*" onchange="handleBannerImageUpload(event)" class="sr-only" />
        <div id="bannerPreviewBox" class="hidden mt-2 bg-slate-900 p-2 rounded-xl">
          <img id="bannerPreviewImg" src="" class="w-full h-auto max-h-32 object-contain rounded-lg" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Título da Campanha *</label>
        <input type="text" id="bannerTitle" required placeholder="Ex: Feirão de Carros e Motos Teresina"
          class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Departamento ao Clicar no Banner</label>
        <select id="bannerTargetDept" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs font-bold bg-white">
          <option value="all">Mostrar Todas as Ofertas</option>
          <option value="eletronicos">Filtrar: Eletrônicos</option>
          <option value="eletrodomesticos">Filtrar: Eletrodomésticos</option>
          <option value="casa">Filtrar: Casa & Decoração</option>
          <option value="construcao">Filtrar: Construção & Ferramentas</option>
          <option value="carros">Filtrar: Carros (Vendas & Serviços)</option>
          <option value="motos">Filtrar: Motos (Vendas & Serviços)</option>
          <option value="servicos_gerais">Filtrar: Serviços Gerais & Seguros</option>
        </select>
      </div>

      <button type="submit" id="saveBannerBtn" class="w-full bg-[#081c45] text-white font-bold py-3 rounded-xl text-sm">
        Publicar Banner no Topo
      </button>

      <div id="adminActiveBannersList" class="pt-3 border-t border-gray-200 space-y-2"></div>
    </form>

    <!-- ABA 5: CAPA PANORÂMICA DO TOPO & CONFIGURAÇÕES -->
    <form id="settingsForm" onsubmit="handleSaveSettings(event)" class="space-y-4 hidden">
      
      <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
        <label class="block text-xs font-bold text-slate-800">Capa Superior / Slogan da Plataforma</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="headerMode" value="logo" checked class="peer sr-only" />
            <div class="text-center py-2.5 rounded-lg border border-gray-300 bg-white text-xs font-semibold peer-checked:bg-[#081c45] peer-checked:text-white transition">
              Capa Panorâmica (HD)
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="headerMode" value="title" class="peer sr-only" />
            <div class="text-center py-2.5 rounded-lg border border-gray-300 bg-white text-xs font-semibold peer-checked:bg-[#081c45] peer-checked:text-white transition">
              Título Escrito
            </div>
          </label>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Imagem da Capa / Slogan Panorâmico (Alta Definição)</label>
          <label for="cfgLogoInput" class="flex items-center justify-center gap-2 w-full py-3 px-3 rounded-xl border-2 border-dashed border-amber-400 bg-amber-50 text-amber-950 text-xs font-bold cursor-pointer active:scale-[0.99] transition">
            <i class="fa-solid fa-panorama text-base text-amber-600"></i>
            <span>Escolher Capa Panorâmica (Alta Definição)</span>
          </label>
          <input type="file" id="cfgLogoInput" accept="image/*" onchange="handleLogoUpload(event)" class="sr-only" />
          
          <div id="cfgLogoPreviewBox" class="mt-2.5 hidden flex-col gap-2 bg-[#031238] p-2 rounded-xl border border-blue-900">
            <img id="cfgLogoPreviewImg" src="" class="w-full h-auto max-h-28 object-contain rounded-lg" />
            <button type="button" onclick="removeLogoImage()" class="text-xs text-red-400 font-semibold hover:underline self-end">Remover capa</button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Nome / Título Alternativo</label>
          <input type="text" id="cfgCompanyName" required value="TERÊ SHOPPING" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Senha de Acesso Administrativo</label>
        <div class="relative">
          <input type="password" id="cfgPassword" required class="w-full border border-gray-300 rounded-xl pl-3 pr-10 py-2 text-sm" />
          <button type="button" onclick="togglePasswordVisibility('cfgPassword', 'cfgEyeIcon')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">
            <i id="cfgEyeIcon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <div class="space-y-2 pt-1">
        <button type="submit" id="saveCfgBtn" class="w-full bg-[#081c45] text-white font-semibold py-3 rounded-xl text-sm hover:bg-blue-900 transition">
          Salvar Capa e Configurações
        </button>
        <button type="button" onclick="cancelAndReturnFromAdmin()" class="w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-200 transition">
          Cancelar e Voltar ao Feed
        </button>
      </div>
    </form>

  </div>
</div>
